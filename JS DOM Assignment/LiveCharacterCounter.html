<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Q2 Live Character Counter</title>
<style>
body{font-family:Arial;padding:20px}
textarea{width:100%;height:120px;padding:8px}
.counter{margin-top:8px;font-weight:bold;padding:4px 8px;display:inline-block}
.yellow{background:yellow}
.red{background:red;color:#fff}
</style>
</head>
<body>
<h2>Live Character Counter</h2>
<textarea id="ta" maxlength="100"></textarea>
<div>
<span id="counter" class="counter">100</span>
<button id="reset">Reset</button>
</div>
<script src="LiveCharacterCounter.js"></script>
</body>
</html>
