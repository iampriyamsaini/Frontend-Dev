<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Q5 Image Gallery Modal</title>
<style>
body{font-family:Arial;padding:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid img{width:100%;height:120px;object-fit:cover;cursor:pointer}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6)}
.modal .box{background:#fff;padding:12px;border-radius:6px}
.hidden{display:none}
</style>
</head>
<body>
<h2>Image Gallery</h2>
<div class="grid" id="grid">
<img src="https://picsum.photos/seed/1/400/300">
<img src="https://picsum.photos/seed/2/400/300">
<img src="https://picsum.photos/seed/3/400/300">
<img src="https://picsum.photos/seed/4/400/300">
<img src="https://picsum.photos/seed/5/400/300">
<img src="https://picsum.photos/seed/6/400/300">
</div>
<div id="modal" class="modal hidden"><div class="box" id="box"><img id="big" style="max-width:80vw;max-height:80vh"></div></div>
<script src="ImageGalleryModal.js"></script>
</body>
</html>
