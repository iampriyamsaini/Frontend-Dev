<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - College Timetable Viewer</title>
    <style>
        body { font-family: 'Inter', sans-serif; padding: 20px; background-color: #e3f2fd; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        h1 { color: #1e88e5; text-align: center; margin-bottom: 20px; }
        .controls { margin-bottom: 20px; text-align: center; }
        #day-selector { padding: 10px 15px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
        #timetable-body { width: 100%; border-collapse: collapse; margin-top: 15px; }
        #timetable-body th, #timetable-body td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        #timetable-body th { background-color: #bbdefb; color: #1e88e5; font-weight: bold; }
        .no-classes, .loading-indicator { text-align: center; color: #555; padding: 20px; font-style: italic; }
        .loading-indicator { color: #1e88e5; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>College Timetable Viewer</h1>
        
        <div class="controls">
            <label for="day-selector">Select Day:</label>
            <select id="day-selector">
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>
            </select>
        </div>

        <div class="loading-indicator" id="loading">Loading timetable...</div>
        
        <table id="timetable-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Subject</th>
                    <th>Faculty</th>
                </tr>
            </thead>
            <tbody id="timetable-body">
                <tr><td colspan="3" class="no-classes">Select a day to view the schedule.</td></tr>
            </tbody>
        </table>
    </div>
    <script src="Q5_TimetableViewer.js"></script>
</body>
</html>
