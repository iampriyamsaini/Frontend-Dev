<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - User Registration</title>
    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; padding: 20px; background-color: #fff3e0; }
        .container { max-width: 450px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        h1 { color: #ff9800; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; background-color: #ff9800; color: white;
            border: none; border-radius: 6px; font-size: 16px; cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #fb8c00; }
        #message { padding: 10px; border-radius: 6px; margin-top: 20px; text-align: center; font-weight: bold; display: none; }
        .error { background-color: #ffcdd2; color: #c62828; border: 1px solid #c62828; }
        .success { background-color: #c8e6c9; color: #2e7d32; border: 1px solid #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <h1>New User Registration</h1>
        
        <form id="registration-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="register-btn">Register</button>
        </form>

        <div id="message"></div>
    </div>
    <script src="Q6_UserRegistration.js"></script>
</body>
</html>
