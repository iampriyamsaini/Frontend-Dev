<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Real-Time Live Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        h1 { color: #1e88e5; text-align: center; margin-bottom: 20px; }
        #search-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        #search-results { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
        .product-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; transition: background-color 0.3s; border-radius: 4px; margin-bottom: 5px;}
        .product-item:hover { background-color: #e3f2fd; }
        .product-image { margin-right: 15px; border-radius: 4px; }
        .product-info { flex-grow: 1; }
        .product-name { font-weight: bold; color: #333; font-size: 1.1em; }
        .product-price { color: #43a047; font-size: 1.1em; font-weight: 600; }
        #loading { text-align: center; color: #1e88e5; display: none; padding: 10px; }
        .no-results { text-align: center; color: #e53935; padding: 20px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product Search</h1>
        <input type="text" id="search-input" placeholder="Start typing to search products (e.g., monitor, chair...)">
        
        <div id="loading">Loading products...</div>
        
        <div id="search-results">
            
        </div>
    </div>
    <script src="Q1_LiveSearch.js"></script>
</body>
</html>
