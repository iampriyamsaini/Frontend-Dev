<!-- 9. Create a paragraph that uses both <strong> and <em> to emphasize different parts of a
sentence. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <p>
        To become a great developer, it is <strong>important</strong> to practice regularly and 
        <em>never give up</em> when facing challenges.
    </p>

</body>
</html>
