<!-- 8. Write a paragraph containing:
● A highlighted word using <mark>
● A small note at the end using <small> (e.g., “Updated recently”). -->

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <p>
        Learning web development is an exciting journey. I especially enjoy working with 
        <mark>HTML</mark> because it forms the foundation of every website. 
        <small>Updated recently.</small>
    </p>

</body>
</html>
