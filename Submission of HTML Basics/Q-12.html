<!-- 12. Create a creative paragraph combining multiple inline elements (<strong>, <em>,
<mark>, <small>, <br>) to demonstrate inline formatting. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <p>
        Becoming a <strong>web developer</strong> is an exciting journey full of learning and creativity. 
        You must <em>stay consistent</em> and practice every day to improve your skills.<br>
        I always highlight important topics with <mark>yellow markers</mark> while studying.<br>
        <small>Note: Keep updating your knowledge as technology evolves.</small>
    </p>

</body>
</html>
